version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: desafio_agentes_ia_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desafio_agentes_ia_app
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/agent_db?schema=public"
      PORT: "3333"
      LOG_LEVEL: "info"
      FAKE_STORE_BASE_URL: "https://fakestoreapi.com"
      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: